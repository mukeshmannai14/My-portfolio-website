<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Young+Serif&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <div class="section-one">
            <h1 class="section-one__name">Mukesh kanna</h1>

            <p class="section-one__role">Web Developer | Full stack developer</p>
            <a class="section-one__contact" href="index.html">Home</a>


        </div>
        <div class="contact-form">
            <form>
                <table>
                    <tr>
                        <td>Name :</td>
                        <td>
                            <input type="text" placeholder="Enter your Name" class="contact-form__input">
                        </td>
                    </tr>
                    <tr>
                        <td>Email :</td>
                        <td>
                            <input type="text" placeholder="Enter your Email" class="contact-form__input">
                        </td>

                    </tr>

                    <tr>
                        <td> Age :</td>
                        <td>
                            <input type="number" placeholder="Enter your Age" class="contact-form__input">
                        </td>
                    </tr>
                    <tr>
                        <td>Department :</td>
                        <td>
                            <select class="contact-form__input">
                                <option>CSE</option>
                                <option>ECE</option>
                                <option>ME</option>
                            </select>
                        </td>

                        </td>

                    </tr>
                    <tr>
                        <td> Mobile number :</td>
                        <td>
                            <input type="number" placeholder="Enter your Mobile Number" class="contact-form__input">
                        </td>
                    </tr>
                    <tr>
                        <td>Message :</td>
                        <td>
                            <textarea placeholder="enter your message.." class="contact-form__textarea"></textarea>

                        </td>
                    </tr>
                    <tr>
                    <tr>
                        <td></td>
                        <td>
                            <input type="submit" value="Submit" class="contact-form__submit">
                        </td>
                    </tr>
                    </tr>
                    <tr>
                    <tr>
                    </tr>
                    </tr>
                </table>
                <div class="section-five">
                    <p class="section-five__description">social Media:
                        <a href="https://www.linkedin.com/in/mukeshkanna14" target="_blank">LinkedIn</a>
                        <a href="https://github.com/mukeshmannai14" target="_blank">
                            GitHub
                        </a>
                    </p>



                    <a class="section-five__copyright" href="">&copy;Mukesh kanna</a>
                </div>
            </form>
        </div>

    </div>
</body>

</html>
